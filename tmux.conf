# Tuned Team tmux settings (its own server: tmux -L tuned). Plain: no background colours.
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g extended-keys on
set -as terminal-features ',*:extkeys'
set -g default-terminal "tmux-256color"
set -g allow-rename off
set -g automatic-rename off
set -g renumber-windows off
set -g set-titles on
set -g set-titles-string "#W"
set -g status-style default
set -g status-left "#S  "
set -g status-left-length 40
set -g status-right "Ctrl-b w: all windows"
set -g window-status-format "#I #W#{?#{==:#W,director}, · you talk here,}#{?#{==:#W,shell}, · last resort,}"
set -g window-status-current-format "#[bold]#I #W#{?#{==:#W,director}, · you talk here,}#{?#{==:#W,shell}, · last resort,}#[default]"
set -g message-style default
set -g mode-style reverse
